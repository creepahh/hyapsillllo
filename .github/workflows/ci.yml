name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check JavaScript
        run: node --check background.js; node --check content.js; node --check popup.js

      - name: Validate manifest references
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = [];
            if (m.background?.service_worker) files.push(m.background.service_worker);
            if (m.action?.default_popup) files.push(m.action.default_popup);
            (m.content_scripts || []).forEach(cs => (cs.js || []).forEach(f => files.push(f)));
            (m.web_accessible_resources || []).forEach(w => (w.resources || []).forEach(f => files.push(f)));
            for (const k of Object.keys(m.icons || {})) files.push(m.icons[k]);
            for (const k of Object.keys(m.action?.default_icon || {})) files.push(m.action.default_icon[k]);
            const missing = [...new Set(files)].filter(f => !fs.existsSync(f));
            if (missing.length) {
              console.error("Missing files referenced by manifest.json:", missing);
              process.exit(1);
            }
            console.log("manifest.json OK — all referenced files exist");
          '

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (lockfile only)
        run: npm install --package-lock-only --ignore-scripts

      - name: Build extension zip
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyapsilo-notes
          path: dist/hyapsilo-notes.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build extension zip
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hyapsilo-notes.zip
          generate_release_notes: true