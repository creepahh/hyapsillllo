<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hyapsilo Notes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffdce8;
    }

    .notes-app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #ffdce8;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-bottom: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #4d3440;
    }

    .notes {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;

      padding: 16px;

      border-radius: 14px;

      background: #ffeaf1;
      color: #3f3036;

      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;

      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    .notes::placeholder {
      color: #b98f9f;
    }

    .notes:focus {
      box-shadow: inset 0 0 0 1px rgba(190, 125, 150, 0.35);
    }

    /* Simple scrollbar */
    .notes::-webkit-scrollbar {
      width: 7px;
    }

    .notes::-webkit-scrollbar-track {
      background: transparent;
    }

    .notes::-webkit-scrollbar-thumb {
      background: #e6afc2;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <main class="notes-app">

    <div class="header">
      <img
        class="avatar"
        src="hyapsiloimg.png"
        alt="Hyapsilo"
      >

      <div class="title">
        My notes
      </div>
    </div>

    <textarea
      id="notes"
      class="notes"
      placeholder="Write something..."
      spellcheck="true"
    ></textarea>

  </main>

  <script>
    const notes = document.getElementById("notes");

    // Load saved note
    chrome.storage.local.get(["savedNote"], (result) => {
      if (result.savedNote) {
        notes.value = result.savedNote;
      }

      notes.focus();
    });

    // Save automatically while typing
    notes.addEventListener("input", () => {
      chrome.storage.local.set({
        savedNote: notes.value
      });
    });
  </script>

</body>
</html>
